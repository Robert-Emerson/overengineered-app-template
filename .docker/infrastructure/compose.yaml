name: microservice-chassis-infrastructure

volumes:
  pgdata:
  promdata:

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib
    ports:
      - 13133:13133 # health_check extension
    volumes:
      - ../../infrastructure/monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
  
  tracing:
    image: jaegertracing/jaeger
    volumes:
      - ../../infrastructure/monitoring/jaeger.yaml:/jaeger/config.yaml

  prometheus:
    image: prom/prometheus
    build:
      context: ../../infrastructure/monitoring/prometheus
    volumes:
      - promdata:/prometheus
      - ../../infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: wget -O/dev/null http://localhost:9090/-/health || exit 1
      timeout: 5s

  grafana:
    image: grafana/grafana
    volumes:
      - ../../infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ../../infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    healthcheck:
      test: wget -q -O /dev/null http://localhost:3000/api/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - prometheus

  auth-db:
    image: postgres
    restart: always
    user: postgres
    build:
      context: ../../infrastructure/db/
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_root_password
      KC_DB_LOGIN: /run/secrets/kc_db_login
      KC_DB_PASSWORD: /run/secrets/kc_db_password
    healthcheck:
      test: pg_isready
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - ../../infrastructure/db/init:/docker-entrypoint-initdb.d/
      - pgdata:/var/lib/postgresql/data
    secrets:
      - db_root_password
      - kc_db_login
      - kc_db_password

  auth:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_HOSTNAME: auth.localhost
      KC_HOSTNAME_PORT: 8080
      KEYCLOAK_ADMIN: ${KC_ADMIN_LOGIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KEYCLOAK_USER: ${KC_USER_LOGIN}
      KEYCLOAK_PASSWORD: ${KC_USER_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth-db/keycloak
      KC_DB_USERNAME: ${KC_DB_LOGIN}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTPS_CERTIFICATE_FILE: /certs/external.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/external.key
    volumes:
      - ../../certs/external_localhost.pem:/certs/external.pem
      - ../../certs/external_localhost.key:/certs/external.key
    depends_on:
      - auth-db
    restart: always
    command: start

  ingress-proxy:
    build:
      context: ../../infrastructure/envoy/
      args:
        ENVOY_VARIANT: contrib-dev
    ports:
      - "8080:8080" # api
      - "8001:8001" # envoy admin
      - "5432:5432" # Postgres
    volumes:
      - ../../certs:/certs
