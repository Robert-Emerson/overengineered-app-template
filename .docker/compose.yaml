name: microservice-chassis

include:
  - ./infrastructure/compose.yaml

secrets:
  kc_db_login:
    environment: "KC_DB_LOGIN"
  kc_db_password:
    environment: "KC_DB_PASSWORD"
  db_root_password:
    environment: "DB_ROOT_PASSWORD"

networks:
  todo-api:

services:
  todo-api:
    build:
      context: ../src/Todo
      target: release
    develop:
      watch:
        - action: rebuild
          path: ../src/Todo
    networks:
      - todo-api
    healthcheck:
      test: wget -O/dev/null http://localhost:8080/todos/health || exit 1
      timeout: 3s
      start_period: 5s
      start_interval: 1s

  todo-proxy:
    image: envoyproxy/envoy:contrib-dev
    networks:
      todo-api:
          aliases:
            - otel-collector.todo-proxy
      default:
    volumes:
      - ../certs:/certs
      - ../infrastructure/envoy/todo-proxy.yaml:/etc/envoy.yaml
    depends_on:
      todo-api:
        condition: service_healthy
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy.yaml", "--log-level", "warn"]